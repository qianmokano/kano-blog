name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

  submit-baidu:
    name: Submit changed articles to Baidu
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for deployment and submit URLs
        env:
          BAIDU_SUBMIT_ENDPOINT: ${{ secrets.BAIDU_SUBMIT_ENDPOINT }}
          BASE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          SITE_URL: https://blog.thekanojyo.com
        run: node scripts/submit-baidu-urls.mjs
